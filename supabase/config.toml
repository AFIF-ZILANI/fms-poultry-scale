# Declares deploy-time settings the CLI would otherwise require as flags on
# every invocation — this file is the durable record, not the flag.

[functions.push-community-sale]
# This function verifies the caller's Clerk session JWT itself (against
# Clerk's own JWKS — see supabase/functions/push-community-sale/index.ts).
# Supabase's platform-level JWT gate must stay off, or it rejects Clerk's
# RS256 tokens before the handler ever runs — the same failure drive-token
# already hit once. Declaring it here means a future `supabase functions
# deploy push-community-sale` can't silently forget the flag.
verify_jwt = false

[functions.drive-token]
# Same reasoning as above — drive-token verifies Clerk JWTs itself too.
verify_jwt = false
